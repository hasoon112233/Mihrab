name: Build Mihrab APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clone Mihrab source
        run: git clone --depth 1 https://github.com/MihrabHQ/Mihrab.git mihrab

      - name: Apply Beast customizations (icon + splash)
        run: |
          cd mihrab
          curl -sL -o /tmp/patch.tar.gz "https://muse.ai/files/1309900792215384/970839586077843/hqk5qi21st39coz4st1oa11r/mihrab-beast-patch.tar.gz"
          tar -xzf /tmp/patch.tar.gz
          test -f android/app/src/main/res/drawable-nodpi/splash_image.png && echo "PATCH OK"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Install JS dependencies
        run: |
          cd mihrab
          npm ci

      - name: Build release APK
        run: |
          cd mihrab/android
          ./gradlew assembleGithubRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: beast-${{ github.run_number }}
          name: Mihrab Beast build ${{ github.run_number }}
          files: mihrab/android/app/build/outputs/apk/github/release/app-github-release.apk
