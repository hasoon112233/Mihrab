name: Build Mihrab APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clone Mihrab source
        run: git clone --depth 1 https://github.com/MihrabHQ/Mihrab.git mihrab

      - name: Apply Beast customizations (icon + splash)
        run: |
          cd mihrab
          curl -sL -o /tmp/patch.tar.gz "https://muse.ai/files/1309900792215384/1079859018011998/m2qdjxwmanhfj1ddwa9hf8x3/mihrab-beast-patch.tar.gz"
          tar -xzf /tmp/patch.tar.gz
          test -f android/app/src/main/res/drawable-nodpi/splash_image.png && echo "PATCH OK"

      - name: Allow legacy variant API (AGP 9)
        run: echo "android.newDsl=false" >> mihrab/android/gradle.properties

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Install JS dependencies
        run: |
          cd mihrab
          npm ci --no-audit

      - name: Generate release signing key
        run: |
          keytool -genkeypair \
            -keystore mihrab/android/app/beast.keystore \
            -alias beast -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass beastkey123 -keypass beastkey123 \
            -dname "CN=Mihrab Beast, OU=Beast, O=Beast, L=Baghdad, ST=Baghdad, C=IQ"
          printf 'storePassword=beastkey123\nkeyPassword=beastkey123\nkeyAlias=beast\nstoreFile=beast.keystore\n' > mihrab/android/keystore.properties

      - name: Build release APK
        run: |
          cd mihrab/android
          ./gradlew assembleGithubRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a --no-daemon --stacktrace

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: beast-${{ github.run_number }}
          name: Mihrab Beast build ${{ github.run_number }}
          files: mihrab/android/app/build/outputs/apk/github/release/app-github-release.apk
